<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Cocolo Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://assets.cocolotravel.com/brand/tokens.css">
<style>
  @font-face {
    font-family: "Roslindale Variable";
    src: url("https://assets.cocolotravel.com/fonts/RoslindaleVariable[opsz,slnt,wdth,wght].woff2") format("woff2-variations");
    font-weight: 200 900;
    font-stretch: 75% 125%;
    font-display: swap;
  }

  :root {
    --ink: var(--color-text-primary);
    --ink-light: rgba(27, 56, 72, 0.6); /* Sumi-60: sanctioned opacity derivative of Sumi */
    --ink-faint: var(--color-brand-kodama);
    --paper: var(--color-background-primary);
    --paper-dark: var(--color-background-secondary);
    --accent: var(--color-brand-kin);
    --font-display: var(--font-style-roslindale), 'Noto Serif JP', serif;
    --font-body: var(--font-style-inter), 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--ink);
    padding: 16px 36px;
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .logo-mark {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; text-decoration: none;
  }

  .logo-mark img { width: 100%; height: 100%; }

  .logo-text {
    font-size: 12px; font-weight: 300;
    letter-spacing: 0.1em; color: rgba(255, 254, 245, 0.55);
  }

  .logo-text strong {
    display: block; font-family: var(--font-display); font-size: 15px; font-weight: 600;
    letter-spacing: 0.02em; color: var(--paper);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }

  .kanji {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: var(--ink-light);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .number {
    font-family: var(--font-display);
    font-size: 96px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    position: relative;
    display: inline-block;
  }

  .number::after {
    content: '';
    display: block;
    width: 40px;
    height: 3px;
    background: var(--accent);
    margin: 20px auto 0;
  }

  .title {
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    margin-top: 28px;
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-light);
    line-height: 1.8;
    max-width: 340px;
    margin-bottom: 40px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 24px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    transition: filter 0.15s;
  }

  .back-link:hover { filter: brightness(1.25); }

  footer {
    padding: 20px 36px;
    border-top: 1px solid var(--paper-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-left {
    font-size: 11px;
    color: var(--ink-light);
  }

  .footer-right {
    font-size: 11px;
    color: var(--ink-light);
  }
</style>
</head>
<body>

<header>
  <a class="logo-mark" href="/">
    <img src="https://assets.cocolotravel.com/logos/svg/logo_cloud_logo_full_washi.svg" alt="Cocolo Travel">
  </a>
  <div class="logo-text">
    <strong>Cocolo Travel</strong>
    ココロトラベル合同会社
  </div>
</header>

<main>
  <div class="kanji">ページが見つかりません</div>
  <div class="number">404</div>
  <div class="title">Page not found</div>
  <p class="subtitle">
    The page you are looking for may have been moved, deleted,
    or does not exist. Please check the URL and try again.
  </p>
  <a class="back-link" href="/">
    ← Return to homepage
  </a>
</main>

<footer>
  <div class="footer-left">Cocolo Travel Co., Ltd. — Tokyo, Japan</div>
  <div class="footer-right">www.cocolotravel.com</div>
</footer>

</body>
</html>
